[build]
  publish = "site"
  # Each live build costs Netlify credits, so skip it when nothing visitors see has changed.
  # Previews are free and always build.
  ignore = "if [ \"$CONTEXT\" != \"production\" ] || [ -z \"$CACHED_COMMIT_REF\" ]; then exit 1; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site"
