<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Clean Slate</title>
<style>
  :root { --bg: #f6f4f0; --ink: #24211d; --muted: #6b655c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161513; --ink: #ece8e1; --muted: #9a938a; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 17px/1.5 Georgia, "Times New Roman", serif; padding: 0 16px; text-align: center; }
  h1 { font-weight: normal; letter-spacing: .04em; margin: 0 0 .4em; }
  p { color: var(--muted); margin: 0; }
</style>
</head>
<body>
  <main>
    <h1>Clean Slate</h1>
    <p>A fresh start, without closing the door forever.</p>
  </main>
</body>
</html>
